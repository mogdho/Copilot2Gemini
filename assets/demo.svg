<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="Animation: pressing the Copilot key opens Gemini, pressing again hides it to the taskbar, pressing again brings it back">
  <style>
    .ui { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    .a { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }

    .key  { animation-name: key; }
    @keyframes key { 0%,7% {transform: translateY(0)} 8.5% {transform: translateY(5px)} 10%,39% {transform: translateY(0)} 40.5% {transform: translateY(5px)} 42%,69% {transform: translateY(0)} 70.5% {transform: translateY(5px)} 72%,100% {transform: translateY(0)} }
    .glow { animation-name: glow; }
    @keyframes glow { 0%,7% {opacity: 0} 8.5% {opacity: 1} 11%,39% {opacity: 0} 40.5% {opacity: 1} 43%,69% {opacity: 0} 70.5% {opacity: 1} 73%,100% {opacity: 0} }

    .win { animation-name: win; transform-box: fill-box; transform-origin: center; }
    @keyframes win {
      0%,9%   {opacity: 0; transform: translate(0,0) scale(.85)}
      15%,40% {opacity: 1; transform: translate(0,0) scale(1)}
      47%,70% {opacity: 0; transform: translate(65px,131px) scale(.05)}
      77%,90% {opacity: 1; transform: translate(0,0) scale(1)}
      96%,100%{opacity: 0; transform: translate(0,0) scale(.85)}
    }
    .ind { animation-name: ind; }
    @keyframes ind { 0%,11% {opacity: 0} 14%,43% {opacity: 1} 46%,73% {opacity: .35} 76%,93% {opacity: 1} 97%,100% {opacity: 0} }

    .cap1 { animation-name: cap1; }
    @keyframes cap1 { 0%,5% {opacity: 0} 9%,35% {opacity: 1} 38%,100% {opacity: 0} }
    .cap2 { animation-name: cap2; }
    @keyframes cap2 { 0%,38% {opacity: 0} 41%,65% {opacity: 1} 68%,100% {opacity: 0} }
    .cap3 { animation-name: cap3; }
    @keyframes cap3 { 0%,68% {opacity: 0} 71%,92% {opacity: 1} 96%,100% {opacity: 0} }

    @media (prefers-reduced-motion: reduce) {
      .a { animation: none !important; }
      .glow, .cap2, .cap3 { opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/><stop offset=".6" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <path id="star" d="M0 -10 C1 -3 3 -1 10 0 C3 1 1 3 0 10 C-1 3 -3 1 -10 0 C-3 -1 -1 -3 0 -10 Z"/>
  </defs>

  <rect width="800" height="380" rx="18" fill="#0f172a"/>

  <!-- Copilot key -->
  <g class="ui">
    <g class="a key">
      <rect x="56" y="112" width="160" height="96" rx="16" fill="#334155" stroke="#64748b"/>
      <rect class="a glow" x="56" y="112" width="160" height="96" rx="16" fill="#2563eb"/>
      <circle cx="136" cy="146" r="13" fill="none" stroke="#f8fafc" stroke-width="3"/>
      <circle cx="136" cy="146" r="5" fill="#f8fafc"/>
      <text x="136" y="189" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Copilot key</text>
    </g>
    <text x="136" y="240" text-anchor="middle" font-size="14" fill="#94a3b8">or  <tspan font-weight="700" fill="#cbd5e1">Win + C</tspan></text>
  </g>

  <!-- Arrow -->
  <path d="M232 160 H 270" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M262 152 L272 160 L262 168" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Desktop -->
  <rect x="284" y="26" width="490" height="276" rx="12" fill="url(#wall)"/>
  <!-- Gemini window -->
  <g class="a win">
    <rect x="330" y="52" width="390" height="204" rx="10" fill="#131314" stroke="#3f3f46"/>
    <path d="M330 62 a10 10 0 0 1 10 -10 h370 a10 10 0 0 1 10 10 v20 h-390 z" fill="#1f1f22"/>
    <use href="#star" transform="translate(346 67) scale(.6)" fill="url(#spark)"/>
    <text x="360" y="72" class="ui" font-size="12" fill="#d4d4d8">Google Gemini</text>
    <text x="664" y="72" class="ui" font-size="12" fill="#a1a1aa">—     ☐     ✕</text>
    <text x="525" y="140" text-anchor="middle" class="ui" font-size="28" font-weight="700" fill="url(#spark)">Hello there</text>
    <text x="525" y="166" text-anchor="middle" class="ui" font-size="14" fill="#a1a1aa">How can I help you today?</text>
    <rect x="360" y="200" width="330" height="36" rx="18" fill="#1f1f22" stroke="#3f3f46"/>
    <text x="380" y="223" class="ui" font-size="13" fill="#71717a">Ask Gemini</text>
  </g>
  <!-- Taskbar -->
  <path d="M284 274 h490 v16 a12 12 0 0 1 -12 12 h-466 a12 12 0 0 1 -12 -12 z" fill="#0b1220" fill-opacity="0.92"/>
  <rect x="458" y="280" width="16" height="16" rx="4" fill="#38bdf8"/>
  <rect x="490" y="280" width="16" height="16" rx="4" fill="#fbbf24"/>
  <rect x="522" y="280" width="16" height="16" rx="4" fill="#f87171"/>
  <rect x="554" y="280" width="16" height="16" rx="4" fill="#34d399"/>
  <use href="#star" transform="translate(590 288) scale(.8)" fill="url(#spark)"/>
  <rect class="a ind" x="582" y="298" width="16" height="3" rx="1.5" fill="#a78bfa"/>

  <!-- Captions -->
  <g class="ui" font-size="22" font-weight="700" text-anchor="middle" fill="#f8fafc">
    <text class="a cap1" x="400" y="340">Press  →  <tspan fill="#a78bfa">Gemini opens</tspan></text>
    <text class="a cap2" x="400" y="340">Press again  →  <tspan fill="#94a3b8">it hides</tspan></text>
    <text class="a cap3" x="400" y="340">Press again  →  <tspan fill="#a78bfa">it's back</tspan></text>
  </g>
  <text x="400" y="366" text-anchor="middle" class="ui" font-size="13" fill="#64748b">Ctrl + Copilot key  →  always opens an extra Gemini window</text>
</svg>
